<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Pondati ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .heart-particle { position: fixed; pointer-events: none; animation: float 4s linear forwards; }
    </style>
</head>
<body class="bg-gradient-to-tr from-pink-100 via-red-50 to-rose-200 min-h-screen font-sans flex flex-col justify-between overflow-x-hidden antialiased selection:bg-rose-300">

    <div id="heart-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <div class="fixed top-4 right-4 z-50">
        <button id="music-btn" onclick="toggleMusic()" class="bg-white/80 backdrop-blur-md p-3 rounded-full shadow-lg border border-pink-200 text-rose-500 hover:scale-110 active:scale-95 transition-all duration-300 cursor-pointer">
            <i id="music-icon" class="fa-solid fa-volume-xmark text-lg"></i>
        </button>
    </div>

    <main class="flex-grow flex items-center justify-center p-4 relative z-10 w-full max-w-md mx-auto">
        <div id="dynamic-card" class="w-full bg-white/90 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-pink-100 text-center transform transition-all duration-300 scale-100 opacity-100">
            </div>
    </main>

    <footer class="w-full text-center py-4 text-xs font-semibold text-rose-400/80 tracking-widest uppercase relative z-10">
        Made with Love Just For You ❤️
    </footer>

    <script src="script.js"></script>
</body>
</html>
